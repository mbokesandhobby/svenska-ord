<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Svenska ord – Quiz</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#101827;color:#f1f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,720px)}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.eyebrow{color:#a5b4fc;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem}.card{background:#1d293b;border:1px solid #334155;border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 22px 60px #0004}h1{font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.2;margin:8px 0 20px}p{line-height:1.6;color:#cbd5e1}.progress{height:9px;background:#334155;border-radius:20px;overflow:hidden;margin-bottom:25px}.fill{height:100%;width:0;background:#818cf8;transition:width .25s}.answers{display:grid;gap:12px;margin-top:26px}.answer{width:100%;text-align:left;background:#29374c;border:1px solid #475569;border-radius:13px;color:#f8fafc;padding:16px 18px;font:inherit;cursor:pointer;line-height:1.4;display:flex;gap:14px}.answer:hover:not(:disabled){border-color:#a5b4fc;background:#34435c}.answer:focus-visible,.primary:focus-visible{outline:3px solid #c4b5fd;outline-offset:3px}.letter{font-weight:800;color:#a5b4fc}.answer.correct{background:#123c32;border-color:#34d399}.answer.wrong{background:#4b242b;border-color:#fb7185}.answer:disabled{cursor:default}.feedback{margin-top:20px;font-weight:650;min-height:26px}.actions{margin-top:24px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:13px 23px;font:inherit;font-weight:750;cursor:pointer}.primary{background:#a5b4fc;color:#101827}.secondary{background:#334155;color:#f8fafc}.muted{color:#94a3b8;font-size:.92rem}.hidden{display:none!important}.resultScore{font-size:3.2rem;font-weight:850;margin:8px 0;color:#a5b4fc}.review{margin-top:26px;display:grid;gap:12px}.reviewItem{padding:15px;border:1px solid #475569;border-radius:12px;background:#243247}.reviewItem strong{display:block;margin-bottom:8px}.reviewItem p{margin:5px 0;font-size:.94rem}.good{color:#6ee7b7}.bad{color:#fda4af}label{display:flex;gap:10px;align-items:center;color:#cbd5e1}input{accent-color:#a5b4fc}footer{text-align:center;margin-top:18px;color:#94a3b8;font-size:.85rem}
</style></head><body><main class="app"><div class="top"><span class="eyebrow">Ordförrådsutmaningen</span></div><section class="card" id="start"><h1>25 ord. Hur många kan du?</h1><p>Utmana ditt ordförråd med 25 ovanliga svenska ord och uttryck. Välj rätt betydelse bland fyra alternativ.</p><label><input type="checkbox" id="shuffle" checked> Blanda frågornas ordning</label><div class="actions"><button class="primary" id="startBtn">Starta quizet →</button></div></section><section class="card hidden" id="quiz"><div class="top"><span id="counter" class="muted"></span><span id="score" class="muted"></span></div><div class="progress" role="progressbar" aria-label="Framsteg" aria-valuemin="0" aria-valuemax="25" id="progress"><div class="fill" id="fill"></div></div><h1 id="question"></h1><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button class="primary hidden" id="nextBtn">Nästa fråga →</button></div></section><section class="card hidden" id="result"><span class="eyebrow">Resultat</span><h1>Så gick det!</h1><div class="resultScore" id="finalScore"></div><p id="summary"></p><div class="actions" style="justify-content:flex-start"><button class="primary" id="againBtn">Spela igen ↻</button><button class="secondary" id="reviewBtn">Visa genomgång</button></div><div class="review hidden" id="review"></div></section><footer>25 frågor · Ingen inloggning behövs.</footer></main><script>
'use strict';const questions=[["abderitisk",["Snabbt föränderlig och oberäknelig","Löjeväckande enfaldig eller trångsynt","Högtidligt religiös och asketisk","Härstammande från förhistorisk tid"],1],["epigoni",["Framstående banbrytare inom vetenskapen","Skeptisk filosof som förnekar sinnesintryck","Efterhärmare utan egen skapande särprägel","Hemlig sammanslutning av konspiratörer"],2],["apokryfisk",["Direkt översatt från klassisk grekiska","Strängt förbjuden enligt lag eller dogm","Avsedd endast för en invigd liten krets","Av okänd eller tvivelaktig äkthet"],3],["kverulans",["Sjuklig eller tvångsmässig benägenhet att ständigt klaga och processa","Överdriven vördnad inför äldre auktoriteter","Fysisk utmattning efter hårt intellektuellt arbete","Ovilja att lämna sin invanda hembygd"],0],["panegyrisk",["Bittert sarkastisk och gäckande","Översvallande lovprisande eller hyllande","Neutralt och objektivt kartläggande","Mystiskt dunkel och mångtydig"],1],["solipsism",["Läran om solens centrala plats i kosmos","En total förnekelse av all moralisk lag","Uppfattningen att endast det egna medvetandet kan veta eller existera","Strävan efter fullkomlig politisk jämlikhet"],2],["sykofant",["Skenbart orubbligt from person med dolda syften","Sliskig smickrare eller ynklig angivare","Vandrande trubadur eller antik skald","Samlare av sällsynta böcker"],1],["tertium comparationis",["Den slutgiltiga vändpunkten i en argumentation","En tredje part som medlar i en tvist","Den gemensamma jämförelsepunkten mellan två ting","Behovet av ett motbevis som kullkastar en teori"],2],["obskurantism",["Dyrkan av dolda krafter och ockultism","Överdriven förkärlek för svårläst och dunkel stil","En arkitektonisk stil präglad av tunga valv","Medvetet motstånd mot upplysning, vetande och klarhet"],3],["perfid",["Överordentlig och pedantisk i sitt nit","Fysiskt svag, skör och bräcklig","Trolös, svekfull eller lömsk","Högdragen och aristokratiskt distanserad"],2],["pleonasm",["Onödig ordrikedom där samma sak sägs två gånger","Ett sammandraget ord med dubbel betydelse","En grammatisk felaktighet i genitivböjningen","En tvetydig formulering som kan tolkas på två sätt"],0],["chikan",["En elegant, flytande och smidig rörelse","En juridiskt hårfin spetsfundighet","Snöplig förolämpning eller förödmjukelse","En dold ekonomisk vinning eller muta"],2],["deklamatorisk",["Lågmäld och förtroligt viskande","Snabbt och stammande osammanhängande","Skrivet i korta, koncisa satser","Högtidligt, oratoriskt eller teatraliskt uppläsande"],3],["eklektisk",["Som plockar ut det bästa ur olika system eller stilar","Byggd på en enda dogmatisk grundregel","Ombytlig i sina känslor från dag till dag","Strikt empiriskt och matematiskt bevisad"],0],["eufemism",["Ett grovt och vulgärt kraftuttryck","En medvetet vilseledande politisk lögn","Förskönande eller mildrande omskrivning","En ordlek baserad på dubbeltydigheter"],2],["fatuitet",["Djup och outgrundlig lärdom","Överdriven flit i arbetet","Korpulent kroppsbyggnad","Stor dumhet eller enfaldig ytlighet"],3],["hagiografi",["Helgonbeskrivning eller okritiskt lovordande biografi","Läran om gamla handskrifters fysiska ålder","Vetenskaplig kartläggning av jordens berglager","Konsten att skriva med konstfärdig kalligrafi"],0],["idiosynkrasi",["Fullständig likformighet hos en grupp människor","Förmåga att tala flera språk flytande","Kronisk sömnlöshet","Särskild personlig egendomlighet eller överkänslighet"],3],["klandestin",["Öppet kungjord och högtidligt stadfäst","Hemlig, i det tysta eller olaglig","Uråldrig och sedan länge glömd av alla","Mycket välstrukturerad och systematisk"],1],["lakonisk",["Utflytande, omständlig och ordrik","Korthuggen, koncis och kärnfull","Drömmande och svävande poetisk","Agiterande och eldfängt uppviglande"],1],["misantrop",["Djurplågare","Ensling som flytt ut i ödemarken","Människofientlig person","Person som föredrar nattmörker framför dagsljus"],2],["nomenklatura",["En formell förteckning över latinska växtnamn","En stelbent byråkratisk regelbok","En hemlig chifferkod för statsdiplomati","Privilegierad ämbetsmannaklass eller maktelit"],3],["akolit",["Medhjälpare, följare eller lärjunge","Överstepräst i en heretisk sekt","Gammaltestamentlig domedagsprofet","Stenhuggarlärling vid katedralbyggen"],0],["tautologi",["En matematiskt omskriven paradox","Ett medvetet motsägelsefullt påstående","Onödig upprepning av samma sak med andra ord","En allegorisk djurfabel"],2],["apoteos",["En medicinsk sammanfattning av ett sjukdomsförlopp","Upphöjande till gudomlighet eller förhärligande höjdpunkt","En långsam och plågsam nedgångsperiod","Ett högtidligt avskedstal inför en resa"],1]];const $=id=>document.getElementById(id);let order=[],index=0,score=0,history=[],answered=false;function show(section){for(const id of ['start','quiz','result'])$(id).classList.toggle('hidden',id!==section)}function begin(){order=questions.map((_,i)=>i);if($('shuffle').checked){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}index=0;score=0;history=[];show('quiz');render()}function render(){answered=false;const q=questions[order[index]];$('counter').textContent=`Fråga ${index+1} av ${questions.length}`;$('score').textContent=`${score} rätt`;$('progress').setAttribute('aria-valuenow',index);$('fill').style.width=`${index/questions.length*100}%`;$('question').textContent=`Vad betyder ${q[0]}?`;$('feedback').textContent='';$('nextBtn').classList.add('hidden');const box=$('answers');box.replaceChildren();q[1].forEach((option,i)=>{const b=document.createElement('button');b.className='answer';const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i]+')';const t=document.createElement('span');t.textContent=option;b.append(letter,t);b.addEventListener('click',()=>choose(i));box.append(b)})}function choose(selected){if(answered)return;answered=true;const q=questions[order[index]],correct=selected===q[2];if(correct)score++;history.push({id:order[index],selected});[...$('answers').children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('feedback').textContent=correct?'✓ Rätt svar!':`✗ Fel svar. Rätt svar är ${'ABCD'[q[2]]}.`;$('score').textContent=`${score} rätt`;$('nextBtn').textContent=index===questions.length-1?'Visa resultat →':'Nästa fråga →';$('nextBtn').classList.remove('hidden')}function next(){if(!answered)return;index++;if(index<questions.length){render();return}show('result');$('finalScore').textContent=`${score} / ${questions.length}`;$('summary').textContent=`Du fick ${Math.round(100*score/questions.length)} % rätt på frågorna.`;$('review').classList.add('hidden');$('reviewBtn').textContent='Visa genomgång';$('review').replaceChildren()}function review(){const box=$('review');if(!box.classList.contains('hidden')){box.classList.add('hidden');$('reviewBtn').textContent='Visa genomgång';return}box.replaceChildren();history.forEach((item,i)=>{const q=questions[item.id],ok=item.selected===q[2],d=document.createElement('div');d.className='reviewItem';const heading=document.createElement('strong');heading.textContent=`${i+1}. ${q[0]} ${ok?'✓':'✗'}`;heading.className=ok?'good':'bad';const correct=document.createElement('p');correct.textContent=`Rätt svar: ${q[1][q[2]]}`;d.append(heading,correct);if(!ok){const your=document.createElement('p');your.textContent=`Ditt svar: ${q[1][item.selected]}`;d.append(your)}box.append(d)});box.classList.remove('hidden');$('reviewBtn').textContent='Dölj genomgång'}$('startBtn').addEventListener('click',begin);$('nextBtn').addEventListener('click',next);$('againBtn').addEventListener('click',()=>show('start'));$('reviewBtn').addEventListener('click',review);
</script></body></html>
